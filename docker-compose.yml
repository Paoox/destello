# ============================================================
#  Destello — Docker Compose
#  Servidor: Toshiba Satellite L55-B | Debian 13
#  Uso: docker compose up -d
# ============================================================

services:

  # ── API Node.js ─────────────────────────────────────────
  api:
    build:
      context:    ./apps/api
      dockerfile: Dockerfile
    container_name: destello-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL=${DB_SSL}
      - WEB_URL=${WEB_URL}
      - REDIS_URL=redis://redis:6379
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - ADMIN_TOKEN_SECRET=${ADMIN_TOKEN_SECRET}
      - ADMIN_TOKEN_EXPIRES=${ADMIN_TOKEN_EXPIRES}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM}
      - BOT_HTTP_URL=${BOT_HTTP_URL}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    depends_on:
      redis:
        condition: service_healthy
    # Permite que el contenedor alcance servicios del host (ej: el bot Faro en :4001)
    # vía http://host.docker.internal:<puerto>
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - destello-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout:  10s
      retries:  3

  # ── Visualizador 3D (container independiente) ─────────────
  viewer3d:
    build:
      context:    ./apps/viewer3d
      dockerfile: Dockerfile
    container_name: destello-3d
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - destello-net
    # Puede crearse más adelante — comentado por ahora
    profiles: ["3d"]

  # ── PostgreSQL ──────────────────────────────────────────
  # La base de datos ahora vive en Supabase (administrada, siempre encendida).
  # Se configura por variables DB_* en el .env. Ya no se corre Postgres local.

  # ── Redis (cache + sessiones) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: destello-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - destello-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Cloudflared (tunnel) ─────────────────────────────────
  # Alternativa a instalarlo como servicio systemd
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: destello-tunnel
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
  #   networks:
  #     - destello-net

# ── Volúmenes persistentes ───────────────────────────────────
volumes:
  redis_data:
    name: destello-redis-data

# ── Red interna ──────────────────────────────────────────────
networks:
  destello-net:
    name: destello-network
    driver: bridge
